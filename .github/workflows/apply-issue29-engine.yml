name: Apply issue 29 hierarchical engine

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-issue29-engine.yml'

permissions:
  contents: write

jobs:
  apply-test-render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hierarchical-lecture-layout
          persist-credentials: true

      - name: Apply issue 29 source changes
        shell: bash
        run: |
          cat .github/issue29/chunks/chunk* | base64 -d | xz -d > /tmp/issue29.patch
          git apply --check /tmp/issue29.patch
          git apply /tmp/issue29.patch
          base64 -d .github/issue29/fix.patch.xz.b64 | xz -d > /tmp/issue29-fix.patch
          git apply --check /tmp/issue29-fix.patch
          git apply /tmp/issue29-fix.patch
          rm -rf .github/issue29
          rm -f .github/workflows/export-hierarchical-source.yml
          rm -f .github/workflows/apply-issue29-engine.yml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck engine and demo
        run: pnpm --dir artifacts/jang-pptx typecheck

      - name: Run complete source tests
        id: source-tests
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/jang-pptx test -- --reporter=verbose 2>&1 | tee issue29-source-tests.log

      - name: Upload source test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue29-source-test-diagnostics
          path: issue29-source-tests.log
          if-no-files-found: error

      - name: Stop on source test failure
        if: steps.source-tests.outcome == 'failure'
        run: exit 1

      - name: Build engine and demo
        run: pnpm --dir artifacts/jang-pptx build

      - name: Generate and inspect standard sample
        run: |
          pnpm --dir artifacts/jang-pptx sample
          pnpm --dir artifacts/jang-pptx inspect:sample

      - name: Verify packed clean consumer
        run: pnpm --dir artifacts/jang-pptx pack:check

      - name: Generate issue 29 review deck
        run: node artifacts/jang-pptx/scripts/generate-hierarchical-review.mjs

      - name: Install visual review tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils

      - name: Render and inspect review deck
        run: |
          mkdir -p artifacts/jang-pptx/generated/issue29-render
          libreoffice --headless --convert-to pdf --outdir artifacts/jang-pptx/generated/issue29-render artifacts/jang-pptx/generated/issue29-hierarchical-review.pptx
          pdfinfo artifacts/jang-pptx/generated/issue29-render/issue29-hierarchical-review.pdf
          pdftoppm -png -r 110 artifacts/jang-pptx/generated/issue29-render/issue29-hierarchical-review.pdf artifacts/jang-pptx/generated/issue29-render/slide
          test -n "$(find artifacts/jang-pptx/generated/issue29-render -name 'slide-*.png' -print -quit)"

      - name: Second independent typecheck
        run: pnpm --dir artifacts/jang-pptx typecheck

      - name: Second independent test run
        run: pnpm --dir artifacts/jang-pptx test

      - name: Second independent build and review generation
        run: |
          pnpm --dir artifacts/jang-pptx build
          node artifacts/jang-pptx/scripts/generate-hierarchical-review.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: issue29-hierarchical-engine-review
          path: |
            artifacts/jang-pptx/generated/issue29-hierarchical-review.pptx
            artifacts/jang-pptx/generated/issue29-hierarchical-review.json
            artifacts/jang-pptx/generated/issue29-render/**
          if-no-files-found: error

      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement hierarchical lecture layout contract"
          git push origin HEAD:feature/hierarchical-lecture-layout
