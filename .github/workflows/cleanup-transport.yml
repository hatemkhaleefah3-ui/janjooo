name: Remove obsolete transport files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Remove obsolete transport payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .automation ]; then
            echo "No obsolete transport payload remains."
            exit 0
          fi
          rm -rf .automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete transport payload"
          git push origin HEAD:${{ github.head_ref }}
