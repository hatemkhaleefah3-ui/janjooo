name: Apply final reviewed reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - '.finalize/READY'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply checksum-verified source reconciliation
        shell: bash
        run: |
          set -euo pipefail
          cat .finalize/part-* | base64 --decode | gzip --decompress > /tmp/final-reconcile.patch
          echo '2b853510e3a917eedbda2c0416bb5fe5f3c79353edfa299c16f59d097fabb7ad  /tmp/final-reconcile.patch' | sha256sum --check
          git apply --check --exclude='.github/**' /tmp/final-reconcile.patch
          git apply --index --whitespace=error-all --exclude='.github/**' /tmp/final-reconcile.patch
          rm -rf .finalize
          git add -A
          git config user.name 'OpenAI implementation agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile final reviewed PPTX engine state'
          git push origin HEAD:${{ github.head_ref }}
