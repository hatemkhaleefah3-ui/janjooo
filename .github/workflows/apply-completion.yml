name: Apply completion payload

on:
  push:
    branches: [finish-pptx-engine]
    paths:
      - '.github/payload/**'
      - '.github/workflows/apply-completion.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: finish-pptx-engine
          fetch-depth: 0

      - name: Verify and apply prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/payload -maxdepth 1 -name 'part*' | wc -l)" -eq 6
          cat .github/payload/part* | base64 -d > /tmp/completion.zip
          unzip -t /tmp/completion.zip
          unzip -oq /tmp/completion.zip -d .
          rm -rf .github/payload
          rm -f .github/workflows/apply-completion.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete production PPTX engine"
          git push origin HEAD:finish-pptx-engine
