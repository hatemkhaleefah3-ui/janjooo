name: Export hierarchical layout source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-hierarchical-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hierarchical-lecture-layout
      - uses: actions/upload-artifact@v4
        with:
          name: janjooo-hierarchical-source
          path: |
            artifacts/jang-pptx/**
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          if-no-files-found: error
