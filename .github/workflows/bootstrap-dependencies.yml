name: Bootstrap completion payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified source payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/payload/ready-v2 ]; then
            echo "Payload has already been consumed."
            exit 0
          fi

          files=(
            .github/payload/part01
            .github/payload/part02a
            .github/payload/part02b
            .github/payload/part02c
            .github/payload/part02d
            .github/payload/part03
            .github/payload/part04
            .github/payload/part05
            .github/payload/part06
          )
          cat "${files[@]}" > /tmp/completion.b64
          echo "737329f730f18516892013f0ed87fd79e7db9021dc3f9e7256db340c3d4edb65  /tmp/completion.b64" | sha256sum -c -
          base64 -d /tmp/completion.b64 > /tmp/completion.zip
          echo "bcfa89b3597a4f360af74f9d11af4f52d60bccd1abf2b7e6486f054213851a10  /tmp/completion.zip" | sha256sum -c -
          unzip -t /tmp/completion.zip
          unzip -oq /tmp/completion.zip -d .

          # Workflow files are committed separately through the authenticated connector.
          rm -f .github/workflows/pptx-engine-ci.yml
          rm -rf .github/payload
          rm -f .github/payload-diagnostics.txt .github/payload-diagnostics-v2.txt .github/payload-inventory.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete production PPTX engine"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
