name: Bootstrap completion payload

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Record payload inventory
        shell: bash
        run: |
          diagnostic=.github/payload-inventory.txt
          {
            echo "payload inventory"
            date -u
            echo
            find .github/payload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            sha256sum .github/payload/*
          } > "$diagnostic" 2>&1 || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$diagnostic"
          git commit -m "chore: record payload inventory" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
