name: PPTX engine CI

on:
  push:
    branches: [main, finish-pptx-engine]
    paths:
      - 'artifacts/jang-pptx/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/pptx-engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/jang-pptx/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/pptx-engine-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verification suite
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          set -u
          failed=0

          run_check() {
            local name="$1"
            shift
            echo "::group::$name"
            set +e
            "$@" 2>&1 | tee "${name}.log"
            local code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "$name failed with exit code $code"
              failed=1
            fi
          }

          run_check typecheck pnpm --filter @jang/pptx-engine typecheck
          run_check tests pnpm --filter @jang/pptx-engine test
          run_check build pnpm --filter @jang/pptx-engine build

          if [ -d artifacts/jang-pptx/dist ]; then
            run_check sample pnpm --filter @jang/pptx-engine sample
            if [ -f artifacts/jang-pptx/generated/jang-pptx-engine-sample.pptx ]; then
              run_check inspect pnpm --filter @jang/pptx-engine inspect:sample
            else
              echo "Sample PPTX was not generated." | tee inspect.log
              failed=1
            fi
            run_check package pnpm --filter @jang/pptx-engine pack:check
          else
            echo "Build output is missing; sample and package checks skipped." | tee sample.log inspect.log package.log
            failed=1
          fi

          exit "$failed"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pptx-engine-verification-diagnostics
          path: '*.log'
          if-no-files-found: error

      - name: Stop after verification failure
        if: steps.verification.outcome == 'failure'
        run: exit 1

      - name: Upload sample presentation
        uses: actions/upload-artifact@v4
        with:
          name: jang-pptx-engine-sample
          path: artifacts/jang-pptx/generated/jang-pptx-engine-sample.pptx
          if-no-files-found: error
