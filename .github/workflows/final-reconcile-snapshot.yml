name: Final reconciliation snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-reconcile-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Package current branch
        run: zip -qr final-reconcile-source.zip . -x '.git/*' 'final-reconcile-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: final-reconcile-source
          path: final-reconcile-source.zip
          retention-days: 1
